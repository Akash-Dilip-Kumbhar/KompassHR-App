<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luminous Glass UI - Leave Details</title>

    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">

    <style>
        .premium-data-value {
            font-weight: 600;
            font-size: 0.95rem;
            width: 100%;
            color: var(--text-muted);
        }
        .premium-data-value.text-danger {
            color: var(--danger) !important;
        }

        .glass-input-wrapper.danger-border {
            border-color: rgba(239, 68, 68, 0.4);
            background: rgba(239, 68, 68, 0.05);
        }
        
        .text-wrap-break {
            white-space: normal;
            word-wrap: break-word;
        }
    </style>
</head>

<body class="bg-luminous pb-5 mb-5 new-request-body">

    <!-- Mobile Wrapper -->
    <div class="mobile-wrapper min-vh-100 position-relative">

        <!-- Sticky Header Container -->
        <div class="sticky-top bg-luminous-header pt-4 pb-2 px-3 z-3">
            <header class="d-flex justify-content-between align-items-center">
                <a href="Leave-Dashboard.html" class="text-dark fs-4 text-decoration-none">
                    <i class="bi bi-chevron-left fw-bold"></i>
                </a>
                <h2 class="h5 mb-0 fw-bold">Leave Details</h2>
                
                <!-- Match leave_add.html header right-side icon -->
                <a href="userprofile.html">
                  <div
                    class="profile-avatar border border-2 border-white rounded-circle shadow-sm overflow-hidden"
                    style="width: 40px; height: 40px; background-color: #fce7db">
                    <img
                      src="https://i.pravatar.cc/150?img=11"
                      alt="Profile avatar"
                      class="img-fluid w-100 h-100 object-fit-cover opacity-75 mix-blend-multiply" />
                  </div>
                </a>
            </header>
        </div>

        <div class="app-content px-3 pt-2">
            
            <div class="d-flex justify-content-between align-items-center mb-2 px-1">
                <h5 class="text-dark fw-bold">SL (Full Day)</h5>
           
            <div class="text-end px-1">
                <span class="badge bg-danger-subtle text-danger border border-danger letter-spacing" style="letter-spacing: 0.5px;">Rejected</span><br>
                <span class="text-muted fw-semibold" style="font-size: 0.85rem;">Cancel 5 months ago</span>
            </div>
             </div>

            <!-- Details represented as premium glass inputs -->
            <div class="d-flex flex-column gap-3 mb-4">
                
                <!-- Doc No & Applied On Row -->
                <div class="row g-3">
                    <div class="col-5">
                        <div class="glass-input-wrapper">
                            <i class="bi bi-hash glass-input-icon text-purple"></i>
                            <div class="glass-input-content">
                                <label class="glass-input-label">Doc No.</label>
                                <div class="premium-data-value">1</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-7">
                        <div class="glass-input-wrapper">
                            <i class="bi bi-calendar-event glass-input-icon text-indigo"></i>
                            <div class="glass-input-content">
                                <label class="glass-input-label">Applied On</label>
                                <div class="premium-data-value">07/Mar/2026</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Name -->
                <div class="glass-input-wrapper">
                    <i class="bi bi-person-fill glass-input-icon text-primary"></i>
                    <div class="glass-input-content">
                        <label class="glass-input-label">Name</label>
                        <div class="premium-data-value">DHEERENDRA KUMAR JOSHI</div>
                    </div>
                </div>

                <!-- Emp No & Business Unit Row -->
                <div class="row g-3">
                    <div class="col-5">
                        <div class="glass-input-wrapper">
                            <i class="bi bi-person-vcard glass-input-icon text-purple"></i>
                            <div class="glass-input-content">
                                <label class="glass-input-label">Emp. No.</label>
                                <div class="premium-data-value">001668</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-7">
                        <div class="glass-input-wrapper">
                            <i class="bi bi-building glass-input-icon text-warning"></i>
                            <div class="glass-input-content">
                                <label class="glass-input-label">Business Unit</label>
                                <div class="premium-data-value text-wrap-break">Head Office</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Leave Type -->
                <div class="glass-input-wrapper">
                    <i class="bi bi-cash-register glass-input-icon text-success"></i>
                    <div class="glass-input-content">
                        <label class="glass-input-label">Leave Type</label>
                        <div class="premium-data-value">SL (Full Day)</div>
                    </div>
                </div>

                <!-- For Date -->
                <div class="glass-input-wrapper">
                    <i class="bi bi-calendar-date glass-input-icon text-secondary"></i>
                    <div class="glass-input-content">
                        <label class="glass-input-label">For Date</label>
                        <div class="premium-data-value">02/Mar/2026 - 02/Mar/2026 (1 days)</div>
                    </div>
                </div>

                <!-- Shift -->
                <div class="glass-input-wrapper">
                    <i class="bi bi-briefcase glass-input-icon text-indigo"></i>
                    <div class="glass-input-content">
                        <label class="glass-input-label">Shift</label>
                        <div class="premium-data-value text-wrap-break">General Shift ( 9:00AM-5:30PM )</div>
                    </div>
                </div>

                <!-- Reason -->
                <div class="glass-input-wrapper">
                    <i class="bi bi-lightbulb glass-input-icon text-warning"></i>
                    <div class="glass-input-content">
                        <label class="glass-input-label">Reason</label>
                        <div class="premium-data-value">s</div>
                    </div>
                </div>

                <!-- Approver -->
                <div class="glass-input-wrapper">
                    <i class="bi bi-person-fill-gear glass-input-icon text-warning"></i>
                    <div class="glass-input-content">
                        <label class="glass-input-label">Approver</label>
                        <div class="premium-data-value text-wrap-break">DHEERENDRA KUMAR JOSHI - 001668</div>
                    </div>
                </div>

                <!-- Approve On -->
                <div class="glass-input-wrapper">
                    <i class="bi bi-calendar-check glass-input-icon text-primary"></i>
                    <div class="glass-input-content">
                        <label class="glass-input-label">Approve On</label>
                        <div class="premium-data-value text-wrap-break">07-03-2026 4.40.36 PM (Manually)</div>
                    </div>
                </div>

                <!-- Attachment -->
                <div class="glass-input-wrapper danger-border">
                    <i class="bi bi-paperclip glass-input-icon text-danger"></i>
                    <div class="glass-input-content">
                        <label class="glass-input-label text-danger">Attachment</label>
                        <div class="premium-data-value text-danger">File not found</div>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
