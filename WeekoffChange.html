<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luminous Glass UI - Week Off Change</title>

    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-luminous pb-5 mb-5">

    <!-- Mobile Wrapper -->
    <div class="mobile-wrapper min-vh-100 position-relative">

        <!-- Sticky Header Container -->
        <div class="sticky-top bg-luminous-header pt-4 pb-2 px-3 z-3">
            <header class="d-flex justify-content-between align-items-center">
                <a href="dashboard.html" class="text-dark fs-4 text-decoration-none">
                    <i class="bi bi-chevron-left fw-bold"></i>
                </a>
                <h2 class="h5 mb-0 fw-bold">Week Off Change</h2>
                <!-- Add new request button -->
                <a href="WeekoffChange_add.html" class="btn btn-sm bg-soft-primary text-primary rounded-circle d-flex align-items-center justify-content-center border-0" style="width: 40px; height: 40px; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.2);">
                    <i class="bi bi-plus-lg fs-5"></i>
                </a>
            </header>
        </div>

        <div class="app-content px-3 pt-3">

            <!-- Search Bar -->
            <div class="mb-4">
                <div class="glass-effect rounded-pill d-flex align-items-center px-3 py-2 shadow-sm border border-light border-opacity-50">
                    <i class="bi bi-search text-muted me-2"></i>
                    <input type="text" class="form-control border-0 bg-transparent shadow-none p-0 text-dark" placeholder="Search requests..." style="font-size: 0.9rem;">
                </div>
            </div>

            <!-- Recent Requests List -->
            <div class="d-flex flex-column gap-3">
                <h4 class="h6 fw-bold text-dark mb-0 px-1">Recent Requests</h4>

                <!-- Request 1 -->
                <div class="request-card glass-effect p-3 d-flex flex-column gap-2">
                    <div class="d-flex align-items-center justify-content-between gap-3">
                        <div class="d-flex align-items-center gap-3 flex-grow-1">
                            <!-- Date Box -->
                            <div class="date-box text-center">
                                <span class="d-block text-muted fw-bold" style="font-size: 0.7rem;">AUG</span>
                                <span class="d-block text-dark fw-bold fs-5 lh-1">15</span>
                                <span class="d-block text-muted fw-bold" style="font-size: 0.7rem;">2026</span>
                            </div>

                            <!-- Details -->
                            <div class="flex-grow-1 border-start ps-3 border-light border-opacity-50">
                                <div class="d-flex flex-column">
                                    <h5 class="mb-1 fw-bold small text-dark">Week Off (Full Day)</h5>
                                    <p class="mb-0 text-muted fw-semibold smaller">Off Date: 15/Aug/2026</p>
                                    <p class="mb-0 text-muted smaller text-truncate" style="max-width: 150px;">Reason: Personal Work</p>
                                </div>
                            </div>
                        </div>

                        <!-- Status Badge -->
                        <div style="display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between;">
                            <span class="badge bg-soft-success text-success fw-bold rounded-pill px-2 py-1 border border-success border-opacity-25" style="font-size: 0.6rem;">
                                APPROVED
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Request 2 -->
                <div class="request-card glass-effect p-3 d-flex flex-column gap-2">
                    <div class="d-flex align-items-center justify-content-between gap-3">
                        <div class="d-flex align-items-center gap-3 flex-grow-1">
                            <!-- Date Box -->
                            <div class="date-box text-center">
                                <span class="d-block text-muted fw-bold" style="font-size: 0.7rem;">AUG</span>
                                <span class="d-block text-dark fw-bold fs-5 lh-1">22</span>
                                <span class="d-block text-muted fw-bold" style="font-size: 0.7rem;">2026</span>
                            </div>

                            <!-- Details -->
                            <div class="flex-grow-1 border-start ps-3 border-light border-opacity-50">
                                <div class="d-flex flex-column">
                                    <h5 class="mb-1 fw-bold small text-dark">Week Off (Full Day)</h5>
                                    <p class="mb-0 text-muted fw-semibold smaller">Off Date: 22/Aug/2026</p>
                                    <p class="mb-0 text-muted smaller text-truncate" style="max-width: 150px;">Reason: Out of town</p>
                                </div>
                            </div>
                        </div>

                        <!-- Status Badge -->
                        <div style="display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between;">
                            <span class="badge bg-soft-warning text-warning fw-bold rounded-pill px-2 py-1 border border-warning border-opacity-25" style="font-size: 0.6rem;">
                                PENDING
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Request 3 -->
                <div class="request-card glass-effect p-3 d-flex flex-column gap-2">
                    <div class="d-flex align-items-center justify-content-between gap-3">
                        <div class="d-flex align-items-center gap-3 flex-grow-1">
                            <!-- Date Box -->
                            <div class="date-box text-center">
                                <span class="d-block text-muted fw-bold" style="font-size: 0.7rem;">SEP</span>
                                <span class="d-block text-dark fw-bold fs-5 lh-1">05</span>
                                <span class="d-block text-muted fw-bold" style="font-size: 0.7rem;">2026</span>
                            </div>

                            <!-- Details -->
                            <div class="flex-grow-1 border-start ps-3 border-light border-opacity-50">
                                <div class="d-flex flex-column">
                                    <h5 class="mb-1 fw-bold small text-dark">Week Off (Full Day)</h5>
                                    <p class="mb-0 text-muted fw-semibold smaller">Off Date: 05/Sep/2026</p>
                                    <p class="mb-0 text-muted smaller text-truncate" style="max-width: 150px;">Reason: Family event</p>
                                </div>
                            </div>
                        </div>

                        <!-- Status Badge -->
                        <div style="display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between;">
                            <span class="badge bg-soft-danger text-danger fw-bold rounded-pill px-2 py-1 border border-danger border-opacity-25" style="font-size: 0.6rem;">
                                REJECTED
                            </span>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
