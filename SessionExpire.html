<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luminous Glass UI - Session Expired</title>

    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">

    <style>
        .session-expire-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .expire-image-container {
            width: 100%;
            max-width: 280px;
            margin-bottom: 2.5rem;
        }

        .expire-image-container img {
            width: 100%;
            height: auto;
            object-fit: contain;
            /* Subtle drop shadow for depth */
            filter: drop-shadow(0 15px 25px rgba(59, 130, 246, 0.15));
        }

        .expire-heading {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 1rem;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #0f172a 0%, #2563eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .expire-subheading {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 3rem;
            max-width: 320px;
            font-weight: 400;
        }

        .login-btn-container {
            width: 100%;
            max-width: 320px;
        }

        .btn-login {
            width: 100%;
            padding: 16px 24px;
            font-size: 1.15rem;
            font-weight: 600;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            border: none;
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px -5px rgba(59, 130, 246, 0.6);
            color: white;
        }

        .btn-login:active {
            transform: scale(0.96);
        }

        /* Decorative Glass Orbs */
        .bg-circle-1 {
            position: absolute;
            top: -10%;
            left: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, rgba(59, 130, 246, 0) 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            filter: blur(20px);
        }

        .bg-circle-2 {
            position: absolute;
            bottom: -5%;
            right: -20%;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.2) 0%, rgba(168, 85, 247, 0) 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            filter: blur(20px);
        }
    </style>
</head>

<body class="bg-luminous new-request-body m-0 p-0">

    <!-- Mobile Wrapper -->
    <div class="mobile-wrapper min-vh-100 position-relative overflow-hidden m-auto">
        
        <!-- Decorative Background Elements -->
        <div class="bg-circle-1"></div>
        <div class="bg-circle-2"></div>

        <div class="session-expire-wrapper">
            
            <div class="expire-image-container">
                <img src="Img/SessionExpire.png" alt="Session Expired">
            </div>

            <h1 class="expire-heading">Whoops, Your session has expired</h1>
            
            <p class="expire-subheading">
                Your session has expired due to your inactivity. No worry, simply login again
            </p>

            <div class="login-btn-container z-3">
                <button class="btn btn-login" onclick="window.location.href='index.html'">Login</button>
            </div>
            
        </div>

    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
